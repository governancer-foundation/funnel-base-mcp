#
# Release — publish the package to the registry from CI, over trusted
# publishing (OpenID Connect). No token is stored anywhere: the runner mints a
# short-lived, workflow-specific credential that the registry verifies against
# the publisher configured on the package. That removes both the long-lived
# credential on a laptop and the one-time password prompt that blocks an
# unattended release.
#
# Prerequisites, once, on the package settings page at npmjs.com:
#   provider  = GitHub Actions
#   repository = governancer-foundation/funnel-base-mcp
#   workflow   = release.yml
#
# Trigger: push a version tag (v0.1.1), or run it by hand from the Actions tab.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      # Required for the runner to mint the OIDC token the registry checks.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Upgrade npm
        # Trusted publishing needs npm 11.5.1 or later; Node 22 ships an older one.
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify the tag matches the manifest version
        # A tag that disagrees with package.json publishes a version nobody
        # asked for, under a name that suggests otherwise.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Publish
        run: npm publish --access public
