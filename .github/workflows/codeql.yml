#
# GitHub CodeQL — static analysis (security + quality queries) for
# javascript-typescript. Free for public OSS repos; private repos require a
# GHAS (GitHub Advanced Security) license. Activates automatically on first
# public push of this repo. Actions are SHA-pinned per supply-chain discipline.
#
# Reference: https://docs.github.com/en/code-security/code-scanning

name: CodeQL

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '37 5 * * 2' # Tuesday 05:37 UTC — staggered vs scorecard (Mon 04:17)

permissions: read-all

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: github.event.repository.visibility == 'public'  # CodeQL code-scanning activates on public flip
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3.29.0
        with:
          languages: ${{ matrix.language }}
          # security-extended bundles the security-and-quality query suite,
          # which catches more cases than the default `security` pack.
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3.29.0

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3.29.0
        with:
          category: '/language:${{ matrix.language }}'
