version = 1
SPDX-PackageName = "@governancer/funnel-base-mcp"
SPDX-PackageSupplier = "Agonist Development AB (Sweden, org.nr 559452-5726)"
SPDX-PackageDownloadLocation = "https://github.com/governancer-foundation/funnel-base-mcp"

# REUSE 3.3 configuration — single-package licence mapping.
#
# REUSE (https://reuse.software) is a tool + spec for declaring the licence and
# copyright of every file in a repository in a machine-readable way. Files that
# already carry inline SPDX headers (src/*.ts) do not strictly need an entry
# here, but are listed for completeness and to cover any file a reviewer adds
# without an inline header.
#
# Reference: https://reuse.software/spec-3.3/

# ── Server code — Apache-2.0 ────────────────────────────────────────────────
[[annotations]]
path = ["src/**", "dist/**", "package.json", "package-lock.json", "tsconfig.json", ".gitignore"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Agonist Development AB"
SPDX-License-Identifier = "Apache-2.0"

# ── CI / tooling / config meta-files — Apache-2.0 ───────────────────────────
[[annotations]]
path = [".github/**", "scripts/**", "CODEOWNERS", "REUSE.toml", ".commit-message-allowlist.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Agonist Development AB"
SPDX-License-Identifier = "Apache-2.0"

# ── Project prose / community-health docs — CC-BY-4.0 ───────────────────────
[[annotations]]
path = ["README.md", "CONTRIBUTING.md", "CODE_OF_CONDUCT.md", "SECURITY.md", "GOVERNANCE.md", "NOTICE"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Agonist Development AB"
SPDX-License-Identifier = "CC-BY-4.0"
